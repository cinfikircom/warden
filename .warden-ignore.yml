# Warden waiver dosyası — gerekçeli bulgu bastırma.
# Buradaki bulgular RAPORDAN ve CI gate'inden (--fail-on) düşülür; ama sessizce
# kaybolmaz: her uygulanan waiver audit log'a ve CLI özetine yazılır.
# Selector'lar (fingerprint / check / id / path) AND mantığıyla eşleşir; her girdi `reason` ister.
#
# NOT: Bu dosya Warden'ın KENDİ reposuna özeldir — tarayıcı kendi tespit-kural
# kaynağını taradığında çıkan self-match'leri kapatır. Başka projeye taşınmaz.
#
# ─────────────────────────────────────────────────────────────────────────────
# KÖK NEDEN ve GEÇİCİLİK
#
# Aşağıdaki `path`+`check` waiver'larının hepsi TEK bir kök nedene dayanır: Warden'ın
# kural dosyaları zafiyet desenlerini REGEX LİTERALİ olarak taşır (`/eval\s*\(/`,
# `dangerouslySetInnerHTML`, `AKIA[0-9A-Z]{16}` …). Satır-bazlı tarayıcı bunları
# çalıştırılan koddan ayırt edemiyor.
#
# Doğru çözüm waiver değil, BAĞLAM FARKINDALIĞI: bir eşleşme regex literali ya da
# string sabiti içindeyse kural tanımıdır, çalıştırılan kod değil. Bu, planlanan taint /
# veri-akışı katmanının işidir (bkz. docs/STRIX-ADOPTION.md §1.2). O katman geldiğinde
# buradaki waiver'ların büyük kısmı GEREKSİZLEŞİR ve kaldırılmalıdır.
#
# Bu yüzden her biri `path` ile Warden'ın kendi kaynağına ve `check` ile tek bir kontrole
# daraltıldı — çıplak `check` waiver'ı aynı kontrolün GERÇEK bulgularını da yutardı.
# ─────────────────────────────────────────────────────────────────────────────

waivers:
  # D7, kart verisi (CVV/CVC/PAN) saklama dedektörü. Warden'ın kendi kaynağı bu
  # anahtar kelimeleri KURAL TANIMI olarak içerir (risk/score.ts CVSS tablosu,
  # risk/waiver.ts dokümantasyonu, compliance kuralları). Warden bir ödeme
  # uygulaması değildir; hiçbir yerde gerçek kart verisi saklanmaz.
  - check: "D7"
    reason: "Warden'ın kendi PCI tespit kurallarının tanımları — gerçek kart verisi saklama değil."

  # B3, zayıf hash (MD5/SHA1) dedektörü. util/finding.ts'deki SHA1 yalnızca
  # içerik-türevli kararlı FINGERPRINT (dedup + CI gate eşleştirme) için kullanılır;
  # parola/imza/oturum gibi güvenlik bağlamında DEĞİL.
  - fingerprint: "4e78860aa998bea8"
    reason: "SHA1 yalnızca fingerprintOf() içerik özeti için; güvenlik amaçlı hash değil."

  # ── SAST kural kataloğu: modules/sast/rules.ts ──────────────────────────────
  # Bu dosya B3/B4/B6/B8 desenlerinin TANIMIDIR. İçindeki `md5`, `eval(`,
  # `node-serialize`, `alg:none` metinleri birer regex parçasıdır.
  - path: "packages/warden-core/src/modules/sast/rules.ts"
    check: "B3"
    reason: "Zayıf-hash kurallarının kendi desen tanımı (md5/sha1 regex literalleri)."
  - path: "packages/warden-core/src/modules/sast/rules.ts"
    check: "B4"
    reason: "JWT/auth kurallarının kendi desen tanımı (alg:none, zayıf secret regex'leri)."
  - path: "packages/warden-core/src/modules/sast/rules.ts"
    check: "B6"
    reason: "Injection kurallarının kendi desen tanımı (SQL/komut/eval/SSTI/NoSQL/LDAP regex'leri)."
  - path: "packages/warden-core/src/modules/sast/rules.ts"
    check: "B8"
    reason: "Güvensiz-deserialization kuralının kendi desen tanımı (node-serialize/vm regex'leri)."

  # ── Secret dedektörünün kendi imza tablosu ──────────────────────────────────
  # git-history.ts ve diğer modüller AKIA…/ghp_… gibi sağlayıcı imzalarını desen
  # olarak taşır; bunlar gerçek anahtar değil, ARAMA DESENİDİR. PLACEHOLDER_SECRET
  # listesi de aynı sebeple eşleşir.
  - path: "packages/warden-core/src/modules/**"
    check: "B1"
    reason: "Secret tarayıcısının kendi sağlayıcı-imza desenleri ve placeholder listesi — gerçek anahtar değil."

  # ── Modül kural tanımları (ACCESS / PAY / EMAIL) ────────────────────────────
  - path: "packages/warden-core/src/modules/access/index.ts"
    check: "ACC-3"
    reason: "Mass-assignment kuralının kendi desen tanımı."
  - path: "packages/warden-core/src/modules/pay/index.ts"
    check: "PAY-5"
    reason: "Ödeme kuralının kendi desen tanımı — Warden ödeme almaz."
  - path: "packages/warden-core/src/modules/pay/index.ts"
    check: "PAY-12"
    reason: "3DS/SCA kuralının kendi desen tanımı — Warden ödeme almaz."
  - path: "packages/warden-core/src/modules/email/index.ts"
    check: "EMAIL-3"
    reason: "SMTP/TLS kuralının kendi desen tanımı — Warden e-posta göndermez."

  # ── FE (DOM-XSS) kural tanımları ────────────────────────────────────────────
  # Eskiden dört ayrı fingerprint waiver'ıydı; fingerprint kural metni her
  # düzenlendiğinde kayıyor ve waiver sessizce ölüyordu. `path`+`check` dayanıklı.
  - path: "packages/warden-core/src/modules/fe/rules.ts"
    check: "FE-3"
    reason: "DOM-XSS sink kurallarının kendi desen tanımları (dangerouslySetInnerHTML/v-html/innerHTML)."
  - path: "packages/warden-core/src/modules/sast/rules.ts"
    check: "FE-3"
    reason: "FE kurallarının modules/fe/'ye taşındığını belirten göç yorumu."
  - path: "packages/warden-core/src/modules/fe/index.ts"
    check: "FE-3"
    reason: >-
      FE-8 (şablon kaçışı) katmanının açıklama yorumu, FE-3'ün kapsadığı istemci-tarafı
      sink adlarını (`innerHTML`, `dangerouslySetInnerHTML`) metin olarak anıyor. Yorumdur,
      çalıştırılan kod değil — aynı bağlam-körlüğü kök nedeni.

  # ── WEB (CSRF) kural tanımı ─────────────────────────────────────────────────
  # WEB-1'in `CSRF_DISABLED` deseni ve onu açıklayan yorumlar `@csrf_exempt` metnini
  # içerir. Warden bir Django uygulaması değildir; burada CSRF muafiyeti KULLANILMIYOR,
  # yalnızca tespit deseni tanımlanıyor.
  - path: "packages/warden-core/src/modules/web/index.ts"
    check: "WEB-1"
    reason: "CSRF-devre-dışı kuralının kendi desen tanımı ve açıklama yorumları — kullanım değil."

  # ── K8S kural tanımı ────────────────────────────────────────────────────────
  - path: "packages/warden-core/src/modules/k8s/index.ts"
    check: "K8S-plain-secret"
    reason: "Manifest düz-secret kuralının kendi desen tanımı."
