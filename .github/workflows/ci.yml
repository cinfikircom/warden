name: CI

# Warden'in kendi kod sağlığı: typecheck + tüm workspace testleri.
# warden.yml güvenlik taraması yapar; bu workflow ise derleme/test regresyonlarını yakalar.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (v4.4.0)
        with:
          node-version: "22"

      # version belirtmiyoruz: pnpm sürümü package.json "packageManager" alanından okunur
      # (ikisi birlikte verilirse action ERR_PNPM_BAD_PM_VERSION ile düşer).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (v4.3.0)

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
