name: Warden Security Audit

# Warden'in KENDİ reposu için örnek workflow. Başka projede kullanmak için: bkz. README "GitHub Action".
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warden:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload için gerekli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (v4.4.0)
        with:
          node-version: "22"

      # version belirtmiyoruz: pnpm sürümü package.json "packageManager" alanından okunur
      # (ikisi birlikte verilirse action ERR_PNPM_BAD_PM_VERSION ile düşer).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (v4.3.0)

      - run: pnpm install --frozen-lockfile

      # Kendi reposunu pasif tara; P0 bulguda job'ı düşür.
      - name: Warden scan (passive)
        run: pnpm warden scan --target . --fail-on P0

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3 (v3.39.3)
        with:
          sarif_file: warden-report/findings.sarif
          category: warden
