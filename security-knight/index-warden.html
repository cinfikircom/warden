<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Warden Knight — Whole-Scan Posture</title>
<link rel="stylesheet" href="./knight.css" />
<style>body{margin:0;background:#efe4c9;padding:22px}.host{max-width:1120px;margin:0 auto}</style>
</head>
<body>
  <div class="host"><div id="kok"></div></div>

  <script type="module">
    import { mountSecurityKnight } from "./knight.js";
    import { WARDEN_POSTURE } from "./posture-warden.js";

    // Phase 2: the Knight now visualizes the WHOLE Warden scan (findings.json → /api/warden/posture).
    // Produce the posture first:  node warden-bridge.mjs --file ../warden-report/findings.json
    mountSecurityKnight(document.getElementById("kok"), {
      posture: WARDEN_POSTURE,
      endpoint: "/api/warden/posture",
      mode: "live",
    });
  </script>
</body>
</html>
