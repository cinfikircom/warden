<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Warden Knight — Complete Security Posture</title>
<link rel="stylesheet" href="./knight.css" />
<style>body{margin:0;background:#efe4c9;padding:22px}.host{max-width:1120px;margin:0 auto}</style>
</head>
<body>
  <div class="host"><div id="kok"></div></div>

  <script type="module">
    import { mountSecurityKnight } from "./knight.js";
    import { COMBINED_POSTURE } from "./posture-combined.js";

    // Phase 3: ONE knight for the WHOLE picture — runtime bot-defense + Warden code-scan.
    // Server merges /api/security/posture (bot) + /api/warden/posture (scan) → /api/combined/posture.
    // Produce the scan side first:  node warden-bridge.mjs --file ../warden-report/findings.json
    mountSecurityKnight(document.getElementById("kok"), {
      posture: COMBINED_POSTURE,
      endpoint: "/api/combined/posture",
      mode: "live",
    });
  </script>
</body>
</html>
