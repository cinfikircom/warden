<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Warden Knight — Security Posture</title>
<link rel="stylesheet" href="./knight.css" />
<style>body{margin:0;background:#efe4c9;padding:22px}.host{max-width:1120px;margin:0 auto}</style>
</head>
<body>
  <div class="host"><div id="kok"></div></div>

  <script type="module">
    import { mountSecurityKnight } from "./knight.js";
    import { WARDEN_POSTURE } from "./posture-warden.js";

    // The Knight visualizes the WHOLE Warden scan (findings.json → /api/warden/posture).
    // "Equip" triggers a real scan (see README's "Real-scan Equip" section) — no canned demo data.
    mountSecurityKnight(document.getElementById("kok"), {
      posture: WARDEN_POSTURE,
      endpoint: "/api/warden/posture",
      mode: "live",
      pollMs: 5000, // background completions (queued fix → merged → re-armed) auto-celebrate
    });
  </script>
</body>
</html>
