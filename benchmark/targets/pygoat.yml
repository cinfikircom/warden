# pygoat (Python / Django) ground truth
#
# Kaynak: https://github.com/adeyosemanputra/pygoat — OWASP Top 10 eğitim uygulaması.
#
# KAPSAM: yalnızca ANA PROJE (`introduction/`, `pygoat/`, `challenge/`, `requirements.txt`).
# `dockerized_labs/` ayrı bir Flask/Django lab koleksiyonudur ve bilerek dışarıda bırakıldı —
# ana projenin recall'unu ayrı bir kod tabanının sonuçlarıyla karıştırmamak için.
#
# Sözlük eşlemesi: XXE -> insecure-deserialization, SSTI -> code-injection-eval.
# Düzeltilmiş varyantlar (auth_failure_lab2: argon2 + lockout) dışarıda bırakıldı.

target: pygoat
repo: https://github.com/adeyosemanputra/pygoat
ref: master
root: pygoat-master
language: Python / Django

vulnerabilities:
  # ---------- settings ----------
  - file: pygoat/settings.py
    line: 25
    class: hardcoded-secret
    evidence: "SECRET_KEY = 'lr66%-a!$km5...'"
    note: "Django SECRET_KEY gömülü; session/CSRF token'ları forge edilebilir."
  - file: pygoat/settings.py
    line: 27
    class: hardcoded-secret
    evidence: "SENSITIVE_DATA = 'FLAGTHAT...'"
    note: "Gizli değer settings dosyasına gömülü."
  - file: pygoat/settings.py
    line: 30
    scope: project
    class: info-disclosure
    evidence: "DEBUG = True"
    note: "Debug açık; hata sayfaları stack trace ve settings sızdırır."
  - file: pygoat/settings.py
    line: 171
    class: hardcoded-secret
    evidence: "SECRET_COOKIE_KEY = 'PYGOAT'"
    note: "JWT imzalama anahtarı gömülü ve tahmin edilebilir."
