# OWASP WebGoat (Java / Spring) ground truth
#
# Kaynak: https://github.com/WebGoat/WebGoat
#
# BU HEDEFİN ÖZEL AMACI: Warden'ın Java'da SIFIR dile özgü kuralı var. Recall'un düşük
# çıkması BEKLENİYOR ve bu dürüst bir sonuçtur — "Java destekleniyor" iddiasının
# gerçekte ne anlama geldiğini ölçer.
#
# Düzeltilmiş varyantlar (ProfileUploadFix, OpenRedirectSecureController,
# SqlOnlyInputValidation*, usersFixed() …) bilerek DIŞARIDA bırakıldı.

target: webgoat
repo: https://github.com/WebGoat/WebGoat
ref: main
root: WebGoat-main
language: Java / Spring

vulnerabilities:
