# OWASP NodeGoat — ground truth
#
# Kaynak: https://github.com/OWASP/NodeGoat (Apache-2.0), OWASP'ın resmi zafiyetli
# Node/Express eğitim uygulaması. Zafiyetler kasıtlıdır ve çoğu kodda yorumla işaretlidir
# ("fix" satırları yorum bloğunda bekler) — bu, envanteri doğrulanabilir kılar.
#
# Her madde kaynak kod okunarak çıkarıldı; `line` gerçek satır numarasıdır.
# `confidence: low` olanlar tartışmaya açıktır (savunma-derinliği kaybı, terk edilmiş
# bağımlılık gibi), ama recall'u yapay şişirmemek için yine de sayılırlar.

target: nodegoat
repo: https://github.com/OWASP/NodeGoat
ref: master
root: NodeGoat-master
language: JS / Express

vulnerabilities:
  # ---------- A1: Injection ----------
  - file: app/data/allocations-dao.js
    line: 78
    class: nosql-injection
    evidence: '$where: `this.userId == ${parsedUserId} && this.stocks > ''${threshold}''`'
    note: "?threshold query parametresi sanitize edilmeden MongoDB $where JavaScript ifadesine gömülüyor."
  - file: app/routes/allocations.js
    line: 21
    class: nosql-injection
    evidence: "const { threshold } = req.query;"
    note: "Ham query parametresi doğrulanmadan DAO'nun $where sorgusuna taşınıyor (taint kaynağı)."
  - file: app/views/allocations.html
    line: 22
    class: nosql-injection
    evidence: '<input type="text" name="threshold" />'
    note: "Güvenli type=number alanı yorumda; serbest metin girişi bırakılmış (savunma-derinliği kaybı)."
    confidence: low
  - file: app/routes/contributions.js
    line: 32
    class: code-injection-eval
    evidence: "const preTax = eval(req.body.preTax);"
    note: "POST gövdesi doğrudan eval()'e veriliyor — sunucu tarafı kod çalıştırma."
  - file: app/routes/contributions.js
    line: 33
    class: code-injection-eval
    evidence: "const afterTax = eval(req.body.afterTax);"
    note: "POST gövdesi doğrudan eval()'e veriliyor."
  - file: app/routes/contributions.js
    line: 34
    class: code-injection-eval
    evidence: "const roth = eval(req.body.roth);"
    note: "POST gövdesi doğrudan eval()'e veriliyor."
  - file: app/routes/session.js
    line: 64
    class: info-disclosure
    evidence: 'console.log("Error: attempt to login with invalid user: ", userName);'
    note: "Kullanıcı girdisi CRLF kaçışı olmadan loga yazılıyor — log forging."
    confidence: low

