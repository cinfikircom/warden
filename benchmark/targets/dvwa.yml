    note: "SQLite dalında escape hiç uygulanmıyor."
  - file: vulnerabilities/brute/source/low.php
    line: 12
    class: sql-injection
    evidence: "WHERE user = '$user' AND password = '$pass'"
    note: "Login sorgusunda filtresiz girdi — auth bypass."
  - file: vulnerabilities/bac/source/low.php
