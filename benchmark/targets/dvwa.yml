    evidence: "WHERE user_id = '$id'"
    note: "Hata bastırıldığı için kör SQL injection; girdi filtresiz."
  - file: vulnerabilities/sqli_blind/source/low.php
    line: 32
    class: sql-injection
    evidence: "SQLite kolunda filtresiz interpolasyon"
    note: "SQLite dalı da korumasız."
  - file: vulnerabilities/sqli_blind/source/medium.php
    line: 13
