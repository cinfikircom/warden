# DVWA — Damn Vulnerable Web Application (PHP) ground truth
#
# Kaynak: https://github.com/digininja/DVWA — klasik PHP eğitim uygulaması.
#
# DVWA KATMANLIDIR: her zafiyet low/medium/high/impossible seviyelerinde ayrı dosyada.
# Bu envantere YALNIZCA `low` ve `medium` alındı. `impossible` dosyaları zafiyetin
# DÜZELTİLMİŞ hâlidir; onları saymak tarayıcının recall'unu yapay olarak düşürürdü.
#
# Envanter kaynak kod okunarak çıkarıldı; `line` gerçek satır numarasıdır.

target: dvwa
repo: https://github.com/digininja/DVWA
ref: master
root: DVWA-master
language: PHP

vulnerabilities:
  # ---------- SQL injection ----------
  - file: vulnerabilities/sqli/source/low.php
    line: 10
    class: sql-injection
    evidence: "SELECT ... WHERE user_id = '$id'"
    note: "GET/POST id parametresi filtresiz tırnak içine gömülüyor."
  - file: vulnerabilities/sqli/source/low.php
    line: 31
    class: sql-injection
    evidence: "SQLite kolunda aynı ham interpolasyon"
    note: "SQLite dalında da filtresiz."
  - file: vulnerabilities/sqli/source/medium.php
    line: 11
    class: sql-injection
    evidence: "WHERE user_id = $id (tırnaksız)"
    note: "mysqli_real_escape_string tırnaksız sayısal bağlamda koruma sağlamaz."
  - file: vulnerabilities/sqli/source/medium.php
    line: 27
    class: sql-injection
    evidence: "SQLite, tırnaksız $id"
    note: "MySQL escape'i SQLite sorgusunda anlamsız."
  - file: vulnerabilities/sqli_blind/source/low.php
    line: 11
